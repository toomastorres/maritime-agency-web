<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Vista previa del sitio institucional">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16304d"/><stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="920" height="560" rx="10" fill="#ffffff"/>
  <!-- barra de ventana -->
  <rect width="920" height="38" rx="10" fill="#0f2236"/>
  <rect y="20" width="920" height="18" fill="#0f2236"/>
  <circle cx="20" cy="19" r="5" fill="#ff5f56"/><circle cx="38" cy="19" r="5" fill="#ffbd2e"/><circle cx="56" cy="19" r="5" fill="#27c93f"/>
  <rect x="90" y="10" width="500" height="18" rx="9" fill="#23415f"/>
  <text x="104" y="23" fill="#9ecbf0" font-size="11">ama-demo.example</text>

  <!-- navbar -->
  <rect x="0" y="38" width="920" height="56" fill="#ffffff"/>
  <line x1="0" y1="94" x2="920" y2="94" stroke="#e6ebf1"/>
  <!-- logo mark -->
  <rect x="24" y="52" width="28" height="28" rx="6" fill="#1e3a5f"/>
  <g fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="38" cy="60" r="1.6"/><line x1="38" y1="61.6" x2="38" y2="72"/><line x1="33" y1="64" x2="43" y2="64"/>
    <path d="M30 68 q0 5 8 5 q8 0 8 -5"/>
  </g>
  <text x="60" y="68" fill="#1e3a5f" font-size="16" font-weight="800">AMA</text>
  <text x="60" y="80" fill="#3d6fa5" font-size="8" letter-spacing="2">MARITIME AGENCY</text>
  <g fill="#475569" font-size="12">
    <text x="470" y="71">Institucional</text>
    <text x="566" y="71">Servicios</text>
    <text x="648" y="71">Schedule</text>
    <text x="726" y="71">Novedades</text>
  </g>
  <rect x="816" y="54" width="80" height="28" rx="14" fill="#1e3a5f"/>
  <text x="856" y="72" fill="#fff" font-size="11" text-anchor="middle">Contacto</text>

  <!-- hero -->
  <rect x="0" y="94" width="920" height="320" fill="url(#hero)"/>
  <!-- olas decorativas -->
  <path d="M0 360 q120 -28 240 0 t240 0 t240 0 t240 0" fill="none" stroke="#2d527a" stroke-width="3" opacity="0.6"/>
  <path d="M0 386 q120 -28 240 0 t240 0 t240 0 t240 0" fill="none" stroke="#27496e" stroke-width="3" opacity="0.6"/>
  <text x="60" y="190" fill="#9ecbf0" font-size="13" letter-spacing="3">AGENCIA MARÍTIMA</text>
  <text x="60" y="238" fill="#ffffff" font-size="40" font-weight="800">Conectamos cargas</text>
  <text x="60" y="284" fill="#ffffff" font-size="40" font-weight="800">con el mundo</text>
  <text x="60" y="318" fill="#c7d7e8" font-size="14">Importación, exportación y servicios portuarios integrales.</text>
  <rect x="60" y="338" width="150" height="40" rx="20" fill="#5aa9e6"/>
  <text x="135" y="363" fill="#0f2236" font-size="13" font-weight="700" text-anchor="middle">Ver servicios</text>
  <rect x="222" y="338" width="150" height="40" rx="20" fill="none" stroke="#9ecbf0"/>
  <text x="297" y="363" fill="#e6f0fa" font-size="13" text-anchor="middle">Schedule de buques</text>
  <!-- idioma -->
  <g font-size="11" fill="#9ecbf0"><text x="820" y="130">ES · EN · IT · PT</text></g>

  <!-- tarjetas de servicios -->
  <g>
    <rect x="60" y="446" width="250" height="86" rx="10" fill="#fff" stroke="#e6ebf1"/>
    <text x="80" y="478" font-size="20">🚗</text>
    <text x="110" y="476" fill="#1e3a5f" font-size="14" font-weight="700">Automóviles &amp; RoRo</text>
    <text x="80" y="504" fill="#64748b" font-size="11">Transporte de vehículos y carga rodante.</text>

    <rect x="335" y="446" width="250" height="86" rx="10" fill="#fff" stroke="#e6ebf1"/>
    <text x="355" y="478" font-size="20">📦</text>
    <text x="385" y="476" fill="#1e3a5f" font-size="14" font-weight="700">Contenedores</text>
    <text x="355" y="504" fill="#64748b" font-size="11">Servicio FCL/LCL puerta a puerta.</text>

    <rect x="610" y="446" width="250" height="86" rx="10" fill="#fff" stroke="#e6ebf1"/>
    <text x="630" y="478" font-size="20">🏗️</text>
    <text x="660" y="476" fill="#1e3a5f" font-size="14" font-weight="700">Carga proyecto</text>
    <text x="630" y="504" fill="#64748b" font-size="11">Piezas sobredimensionadas y break-bulk.</text>
  </g>
</svg>
