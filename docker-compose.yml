# Demo local: sitio público + portal admin + MySQL 8 con datos ficticios de demostración.
#   docker compose up --build   →   http://localhost:8080
#   Portal admin:               →   http://localhost:8080/gestion-interna-agencia/
services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ama_web
      MYSQL_USER: ama_web
      MYSQL_PASSWORD: ama_web
    # Se montan únicamente el esquema unificado y el seed de demostración en orden explícito
    # (evitando ejecutar scripts destructivos como reset_data.sql).
    volumes:
      - ./database/install.sql:/docker-entrypoint-initdb.d/01-install.sql:ro
      - ./database/seed_demo.sql:/docker-entrypoint-initdb.d/02-seed-demo.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_USER: ama_web
      DB_PASS: ama_web
      DB_NAME: ama_web
      SMTP_HOST: mail.hosting-ejemplo.example
      SMTP_PORT: "465"
      SMTP_SECURE: ssl
      SMTP_FROM: no-reply@avisos.atlantic-agency.example.com
      SMTP_FROM_NAME: AMA Sistemas
      NOTIFY_TO: info@atlantic-agency.example.com

volumes:
  db_data:
