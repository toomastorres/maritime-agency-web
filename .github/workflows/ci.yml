name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Lint PHP (php -l en todos los archivos)
        run: |
          set -e
          find . -path ./vendor -prune -o -name "*.php" -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Validar composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Validar JSON de i18n
        run: |
          for f in src/i18n/*.json; do
            php -r 'json_decode(file_get_contents($argv[1])); if (json_last_error() !== JSON_ERROR_NONE) { fwrite(STDERR, $argv[1] . ": JSON invalido\n"); exit(1); }' "$f"
          done
